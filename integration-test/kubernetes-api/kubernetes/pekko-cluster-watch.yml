# Mirrors pekko-cluster.yml, but runs the demo with the Kubernetes Watch API instead of
# repeated pod list requests. Kept as a separate file so that the list-mode test and the
# watch-mode test deploy independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pekko-bootstrap-demo
  name: pekko-bootstrap-demo
spec:
  replicas: 3
  selector:
    matchLabels:
     app: pekko-bootstrap-demo
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: pekko-bootstrap-demo
        actorSystemName: pekko-bootstrap-demo
    spec:
      containers:
      - name: pekko-bootstrap-demo
        image: integration-test-kubernetes-api:1.3.3.7
        # Remove for a real project, the image is picked up locally for the integration test
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /alive
            port: management
        readinessProbe:
          httpGet:
            path: /ready
            port: management
        ports:
        # pekko-management bootstrap
        - containerPort: 7626
          protocol: TCP
        env:
        - name: PEKKO_CLUSTER_BOOTSTRAP_SERVICE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: "metadata.labels['app']"
        # Agrona requires the add-opens to work on recent JDKs. The api-poll-mode property is what
        # this deployment is for: it puts discovery on the Watch API rather than repeated list calls.
        - name: JAVA_OPTS
          value: "--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED -Dpekko.discovery.kubernetes-api.api-poll-mode=watch"

---
#
# The same role as pekko-cluster.yml. It already grants `watch` alongside `list`, which is what
# api-poll-mode = "watch" needs.
#
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pod-reader
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: read-pods
subjects:
- kind: ServiceAccount
  name: default
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
